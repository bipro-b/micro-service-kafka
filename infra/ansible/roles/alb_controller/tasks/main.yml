---
- name: Add EKS Helm repo
  kubernetes.core.helm_repository:
    name: eks
    repo_url: "https://aws.github.io/eks-charts"

- name: Install AWS Load Balancer Controller
  kubernetes.core.helm:
    name: aws-load-balancer-controller
    chart_ref: eks/aws-load-balancer-controller
    chart_version: "{{ alb_controller_helm_version }}"
    release_namespace: kube-system
    wait: true
    values:
      clusterName: "{{ cluster_name }}"
      serviceAccount:
        create: true
        name: aws-load-balancer-controller
        annotations:
          eks.amazonaws.com/role-arn: "{{ alb_controller_role_arn }}"
      replicaCount: 2

- name: Wait for ALB controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: aws-load-balancer-controller
    namespace: kube-system
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
