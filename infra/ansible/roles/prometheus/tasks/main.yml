---
- name: Add Prometheus community Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "https://prometheus-community.github.io/helm-charts"

- name: Install kube-prometheus-stack (release name {{ prometheus_release_name }})
  kubernetes.core.helm:
    name: "{{ prometheus_release_name }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ prometheus_helm_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    wait: true
    values_files:
      - "{{ role_path }}/files/prometheus-values.yaml"
    values:
      grafana:
        adminPassword: "{{ grafana_admin_password }}"

- name: Wait for Grafana to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: "{{ prometheus_release_name }}-grafana"
    namespace: "{{ monitoring_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Get Grafana LoadBalancer URL
  kubernetes.core.k8s_info:
    kind: Service
    name: "{{ prometheus_release_name }}-grafana"
    namespace: "{{ monitoring_namespace }}"
  register: grafana_svc

- name: Print Grafana URL
  ansible.builtin.debug:
    msg: "Grafana URL: http://{{ grafana_svc.resources[0].status.loadBalancer.ingress[0].hostname }}"
  when: grafana_svc.resources[0].status.loadBalancer.ingress is defined
