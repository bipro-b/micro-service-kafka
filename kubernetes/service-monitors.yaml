# ServiceMonitors tell Prometheus to scrape /metrics from each service.
# label "release: stable" must match the kube-prometheus-stack Helm release name.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-monitor
  namespace: mega
  labels:
    release: stable
    app: api-gateway
spec:
  namespaceSelector:
    matchNames:
      - mega
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
